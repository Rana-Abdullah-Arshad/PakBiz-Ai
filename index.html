
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PakBiz AI | Automation for Pakistani Sellers</title>
    <meta name="description" content="PakBiz AI - Empowering Pakistani freelancers and small businesses with AI-driven pricing logic, WhatsApp scripts, and ad captions. No subscription, no database." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --primary: #16a34a;
        --secondary: #0f172a;
      }
      body {
        font-family: 'Inter', sans-serif;
        scroll-behavior: smooth;
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      .gradient-bg {
        background: radial-gradient(circle at top right, #f0fdf4, #ffffff);
      }
      .dark .gradient-bg {
        background: radial-gradient(circle at top right, #064e3b, #0f172a);
      }
      .card-shadow {
        box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }
      .float-animation {
        animation: float 6s ease-in-out infinite;
      }

      /* Dynamic Theme overrides for Tailwind components */
      .bg-primary { background-color: var(--primary); }
      .text-primary { color: var(--primary); }
      .border-primary { border-color: var(--primary); }
      .bg-secondary { background-color: var(--secondary); }
      .text-secondary { color: var(--secondary); }
      
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #e2e8f0;
        border-radius: 10px;
      }
      .dark .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #334155;
      }
    </style>
    </head>
  <body class="gradient-bg text-slate-900 dark:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
